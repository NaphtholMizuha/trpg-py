[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augury"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.0.0",
    "fastembed>=0.7.1",
    "langchain-openai>=0.0.0",
    "langchain-core>=1.2.0",
    "langgraph>=0.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.17.0",
    "requests>=2.31.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["augury*"]
